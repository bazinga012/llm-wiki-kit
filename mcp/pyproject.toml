[project]
name = "wiki-mcp"
version = "0.1.0"
description = "Agent-agnostic MCP server for a Karpathy-style LLM knowledge wiki: exposes capture/ingest/query/lint as MCP prompts plus file/git tools scoped to the wiki dir."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2.0"]

[project.scripts]
wiki-mcp = "wiki_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wiki_mcp"]

# Bundle the neutral command bodies (single source of truth) into the wheel so
# the server has the prompts even when installed outside the repo checkout.
[tool.hatch.build.targets.wheel.force-include]
"../commands-src" = "wiki_mcp/prompts"
